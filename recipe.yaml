package:
  name: pprint
  version: "0.2.2"

source:
  path: .

build:
  script:
    - mkdir -p $PREFIX/lib/mojo
    - cp -r pprint $PREFIX/lib/mojo/

requirements:
  host:
    - mojo >=1.2.0,<2.0.0
  run:
    - mojo >=1.2.0,<2.0.0

about:
  summary: Reflection-driven pretty printer for Mojo structs
  license: MIT
