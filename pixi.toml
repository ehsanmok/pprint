[workspace]
authors = ["ehsanmok <ehsanmok@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "pprint"
platforms = ["linux-64", "osx-arm64"]
version = "0.2.0"
preview = ["pixi-build"]

[package]
name = "pprint"
version = "0.2.0"

[package.build]
# Lower bound only, deliberately.
#
# A build backend declares which `pixi-build-api-version` it speaks and
# pixi provides that as a virtual package, so matching backend to client
# is the solver's job. An exact pin takes that choice away: `==0.3.13`
# speaks API 4, and every pixi newer than 0.70.2 provides >= 5, so
# resolution failed outright with "pixi-build-api-version >=4,<5, for
# which no candidates were found".
#
# A range lets pixi 0.70.x keep picking 0.3.13 and newer pixi pick a
# 0.4.x that speaks its API.
backend = { name = "pixi-build-rattler-build", version = ">=0.3.13" }

[dependencies]
pprint = { path = "." }
mojo = ">=1.1.0,<2.0.0"

[feature.dev.dependencies]
pre-commit = ">=4.2.0,<5"
mojodoc = { git = "https://github.com/ehsanmok/mojodoc.git", branch = "main" }

[environments]
default = { features = ["dev"], solve-group = "default" }
dev     = { features = ["dev"], solve-group = "default" }

[tasks]
# Format
install-pre-commit = "pre-commit install"
format = { cmd = "mojo format pprint tests examples", depends-on = ["install-pre-commit"] }

# Tests
tests = "mojo -I . tests/test_scalars.mojo && mojo -I . tests/test_structs.mojo && mojo -I . tests/test_config.mojo && mojo -I . tests/test_edge_cases.mojo"
test-scalars = "mojo -I . tests/test_scalars.mojo"
test-structs = "mojo -I . tests/test_structs.mojo"
test-config = "mojo -I . tests/test_config.mojo"
test-edge-cases = "mojo -I . tests/test_edge_cases.mojo"

# Example
example = "mojo -I . examples/example.mojo"

# Docs
docs = "mojodoc ./pprint --open"
docs-build = "mojodoc ./pprint --out-dir target/doc --base-url /pprint/"
